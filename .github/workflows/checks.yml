name: Game checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate match simulation and statistics
        run: node tests/game.cjs
      - name: Validate drafting and distinct team matchups
        run: node tests/draft.cjs
      - name: Validate signature ultimates and recharge rules
        run: node tests/ultimates.cjs
      - name: Validate defensive counters and QB ultimate hits
        run: node tests/defense.cjs
      - name: Validate signature dances and synchronized stadium screen
        run: node tests/dances.cjs
      - name: Validate animation frames
        run: node tests/motion.cjs
      - name: Validate complete browser rendering and replay transitions
        run: node tests/render.cjs
      - name: Validate play calls and horizontal projection
        run: node tests/playbook.cjs
      - name: Validate stadium artwork and crowd behavior
        run: node tests/stadium.cjs
      - name: Validate stereo soundtrack, PCM instruments and controls
        run: node tests/music.cjs
      - name: Validate synchronized game effects and cadence
        run: node tests/fx.cjs
      - name: Validate all eight-direction character animations
        run: node tests/sprites.cjs
      - name: Validate detailed portraits and readable elemental ultimates
        run: node tests/presentation.cjs
      - name: Validate account flows and guest exclusion
        run: node tests/account.cjs
      - name: Validate server-verified results and persistent standings
        run: node tests/league.mjs
      - name: Validate team names and roster share links
        run: node tests/team-links.cjs
      - name: Validate paired line blocking and defender releases
        run: node tests/blocking.cjs
      - name: Validate private two-coach PvP matches and durable rooms
        run: node tests/pvp.mjs
